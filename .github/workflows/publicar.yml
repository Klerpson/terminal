name: Publicar sitio

# Publica en GitHub Pages con Jekyll 4.4 (el build clásico de Pages solo admite Jekyll 3.10).
# Requiere Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - name: Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # Los .js servidos como archivo, minificados con esbuild: compress.html solo cubre HTML y CSS
      # (en un .js los // y las sentencias sin ; se rompen al quedar en una línea). Versión fijada.
      - name: Minificar JS
        run: |
          mapfile -t js < <(find _site -name '*.js' ! -name '*.min.js')
          if [ ${#js[@]} -gt 0 ]; then npx -y esbuild@0.28.2 "${js[@]}" --minify --allow-overwrite --outdir=_site --outbase=_site --log-level=warning; fi
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
